spring:
  application:
    name: chat

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

chat:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5000
  files:
    max-size: 10485760 # 10 MB
    storage-path: ./storage/chat

server:
  port: 8080
